[package]
name = "solduel"
version = "0.1.0"
description = "Staked 1v1 minigames on Solana devnet"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solduel"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
test-game = []

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
solana-nostd-sha256 = "0.2.0"
sha2 = { version = "0.10.8", default-features = false }
mpl-core = "0.12.1"

[dev-dependencies]
solduel = { path = ".", features = ["test-game"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
